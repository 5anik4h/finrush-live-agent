<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" ry="112" fill="#0A1A0F"/>
  <!-- "F" in white, "r" in lime -->
  <text
    x="256"
    y="340"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="260"
    font-weight="800"
    text-anchor="middle"
    letter-spacing="-8"
    clip-path="url(#rounded)"
  >
    <tspan fill="#F0F5F1">F</tspan><tspan fill="#C8FF00">r</tspan>
  </text>
</svg>
